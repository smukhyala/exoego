# Shared settings. Per-config files override `name`, `contrastive`, `lambda`.
backbone: videomae
frames: 16

# Temporal head
d_model: 256
num_heads: 4
num_layers: 2
proj_dim: 128
dropout: 0.1

# Optimisation. `steps` is fixed across configs so every config takes the same
# number of supervised updates -- otherwise a contrastive config would simply be
# training longer, and the comparison would mean nothing.
lr: 0.001
weight_decay: 0.05
steps: 1000
batch_labeled: 64
batch_pairs: 64

# Contrastive term
temperature: 0.07
lambda: 0.0
min_scale: 0.5
contrastive: none
pairs_follow_labels: false

# Sweep. -1 means "all labelled training clips".
budgets: [25, 50, 100, 200, 400, 800, -1]
seeds: [0, 1, 2, 3, 4]
