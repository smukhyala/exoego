[project]
name = "exoego"
version = "0.1.0"
description = "Does exocentric human video improve representations learned from egocentric video?"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "opencv-python-headless",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "huggingface_hub",
    "safetensors",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
